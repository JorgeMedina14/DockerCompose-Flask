version: '3.9'

services:
  # Servicio de la aplicación Flask
  app:
    build: .
    container_name: flask-app
    ports:
      - "8080:5000"
    environment:
      - DB_HOST=db
      - DB_NAME=mensajesdb
      - DB_USER=admin
      - DB_PASSWORD=admin123
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app-network

  # Servicio de la base de datos PostgreSQL
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      - POSTGRES_DB=mensajesdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

# Volúmenes para persistencia de datos
volumes:
  db_data:
    driver: local

# Red para comunicación entre contenedores
networks:
  app-network:
    driver: bridge